name: simulink
on:
  push:
  workflow_dispatch:
jobs:
  simulink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          products: Simulink
          cache: true
      - uses: matlab-actions/run-command@v2
        with:
          command: run_all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulink-modelleri
          path: |
            **/*.slx
            resimler/*.png
          if-no-files-found: ignore
